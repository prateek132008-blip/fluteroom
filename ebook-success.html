<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Successful — 30 Alankaras for Flute | The Flute Room</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/style.css">
<script src="js/config.js" defer></script>

<!-- ============ META PIXEL BASE CODE ============
     Reuses the SAME Pixel ID as every other page. Only base pixel + PageView
     here on load. Purchase fires below, once, from the dedup-guarded script. -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '27629504953321020');
fbq('track', 'PageView');
</script>

<style>
  body { background: var(--cream); }
  .success-wrap { max-width: 620px; margin: 0 auto; padding: 90px 24px; }
  .success-card { background: var(--white); border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); padding: 44px 36px; text-align: center; }
  .success-icon { width: 64px; height: 64px; border-radius: 50%; background: var(--orange-wash); color: var(--orange); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
  .ebook-mini-cover { width: 96px; margin: 0 auto 18px; filter: drop-shadow(0 14px 12px rgba(17,17,17,0.22)) drop-shadow(0 4px 5px rgba(17,17,17,0.16)); }
  .lifetime-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--orange-wash); color: var(--orange-deep);
    font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    padding: 7px 14px; border-radius: 100px; margin: 14px 0 22px;
  }
  /* ---- Support warning: red highlight/glow, distinct from the site's orange system on purpose ---- */
  .support-warning {
    background: #FDEDEC;
    border: 1.5px solid #F1948A;
    border-radius: 12px;
    padding: 18px 20px;
    text-align: left;
    font-size: 14px;
    margin: 26px 0;
    color: #922B21;
    box-shadow: 0 0 0 rgba(231,76,60,0.35);
    animation: warn-glow 2.4s ease-in-out infinite;
  }
  .support-warning strong { display: block; margin-bottom: 6px; color: #C0392B; }
  @keyframes warn-glow {
    0%, 100% { box-shadow: 0 0 0 rgba(231,76,60,0.28); }
    50% { box-shadow: 0 0 22px rgba(231,76,60,0.35); }
  }
  .btn-whatsapp-support {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: #1F7A4D; color: #fff; border: none; border-radius: 100px;
    padding: 12px 22px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 10px;
  }
  .detail-list { text-align: left; font-size: 14px; color: var(--ink-soft); margin-top: 20px; }
  .detail-list div { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); }
</style>
</head>
<body>

<div class="success-wrap">
  <div class="success-card">
    <div class="success-icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <img class="ebook-mini-cover" id="ebookMiniCover" src="assets/alankaars-ebook-cover.png" alt="30 Alankaras for Flute eBook cover">
    <h1 style="font-size:26px;">Payment Successful 🎉</h1>
    <p style="color:var(--ink-soft); margin-top:8px;">Your <strong>30 Alankaras for Flute</strong> eBook is ready.</p>

    <div class="lifetime-pill">🔒 Lifetime Access</div>

    <a href="#" id="downloadEbookBtn" target="_blank" rel="noopener" class="btn btn-primary btn-block">Download / Access Your eBook</a>

    <div class="support-warning">
      <strong>Haven't received the eBook on your email, or having trouble downloading it using the link above?</strong>
      Contact us on WhatsApp and we'll help right away.
      <div>
        <button class="btn-whatsapp-support" id="ebookSupportWhatsapp">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.5 1.3 5L2 22l5.2-1.3c1.4.8 3.1 1.3 4.8 1.3 5.5 0 10-4.5 10-10S17.5 2 12 2z"/></svg>
          Contact Support on WhatsApp
        </button>
      </div>
    </div>

    <div class="detail-list" id="detailList"></div>

    <a href="alankaars-ebook.html" style="display:inline-block; margin-top:26px; font-size:13.5px; color:var(--ink-soft); text-decoration:underline;">Back to eBook page</a>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const raw = sessionStorage.getItem("tfr_ebook_success_payload");
  if (!raw) {
    // No payload (e.g. user navigated here directly) — send them back rather than showing an empty state.
    window.location.href = "alankaars-ebook.html";
    return;
  }
  const data = JSON.parse(raw);

  // ---- The SAME configured Drive link (EBOOK_CONFIG.EBOOK_DRIVE_LINK) that goes
  // into the confirmation email is used here too, so there's only one place to update it.
  // Prefer the value captured on the eBook page at purchase time (data.ebookLink);
  // fall back to the live config in case it was updated since.
  const driveLink = (data.ebookLink && !data.ebookLink.startsWith("NEEDS_CONFIGURATION"))
    ? data.ebookLink
    : EBOOK_CONFIG.EBOOK_DRIVE_LINK;

  const downloadBtn = document.getElementById("downloadEbookBtn");
  if (driveLink && !driveLink.startsWith("NEEDS_CONFIGURATION")) {
    downloadBtn.href = driveLink;
  } else {
    downloadBtn.href = "#";
    downloadBtn.textContent = "Access link coming shortly — contact WhatsApp support";
  }

  document.getElementById("detailList").innerHTML = `
    <div><span>Product</span><strong>30 Alankaras for Flute</strong></div>
    <div><span>Name</span><strong>${data.fullName}</strong></div>
    <div><span>Email</span><strong>${data.email}</strong></div>
    <div><span>Amount</span><strong>₹${data.amount}</strong></div>
    <div><span>Order ID</span><strong>${data.orderId}</strong></div>
    <div><span>Payment ID</span><strong>${data.paymentId}</strong></div>
  `;

  document.getElementById("ebookSupportWhatsapp").addEventListener("click", () => {
    const msg = encodeURIComponent(`Hi, I haven't received my "30 Alankaras for Flute" eBook. Order ID: ${data.orderId}, Payment ID: ${data.paymentId}, Email: ${data.email}`);
    window.open(`https://wa.me/${SITE_CONFIG.WHATSAPP_NUMBER}?text=${msg}`, "_blank");
  });

  /* ============ META PIXEL — PURCHASE (fires exactly once per payment) ============
     Same dedup strategy as the existing enrollment success.html:
     1. eventID is derived from the Razorpay payment ID, so Meta's own
        deduplication (event_id) collapses any duplicate sends of the SAME payment.
     2. A localStorage flag keyed to that payment ID also blocks a second
        client-side fire if this page is refreshed.
     Together this guarantees ONE Purchase event per transaction. Uses a
     DIFFERENT localStorage key prefix (tfr_ebook_purchase_fired_) from the
     enrollment flow's tfr_purchase_fired_, so the two can never collide. */
  const firedKey = "tfr_ebook_purchase_fired_" + data.paymentId;
  if (!localStorage.getItem(firedKey) && typeof fbq === "function") {
    // ---- Advanced Matching (new): attach the customer's plain-text info so
    // fbevents.js hashes + includes it with this Purchase event, raising EMQ.
    // Nothing raw/hashed is sent to Meta by our own code — the Pixel does it.
    const nameParts = (data.fullName || "").trim().split(/\s+/);
    // NEW: ph is normalized to match Ebook_Code.gs's normalizePhone() (adds
    // the India country code for a bare 10-digit number) so the browser
    // Purchase event's phone hash matches the server CAPI Purchase event's
    // phone hash for the same customer — previously these could hash
    // differently. NEW: external_id (raw — the Pixel hashes it, same as
    // em/ph/fn/ln) adds an extra match signal sourced from the
    // already-collected email.
    const rawWhatsapp = (data.whatsapp || "").replace(/\D/g, "");
    const normalizedPhone = rawWhatsapp.length === 10 ? "91" + rawWhatsapp : rawWhatsapp;
    fbq("set", "userData", {
      em: data.email,
      ph: normalizedPhone,
      fn: nameParts[0] || "",
      ln: nameParts.slice(1).join(" ") || "",
      external_id: (data.email || "").trim().toLowerCase()
    });
    fbq("track", "Purchase", {
      value: data.amount,
      currency: "INR",
      content_name: data.productName || "30 Alankaras for Flute",
      content_type: "product"
    }, { eventID: "ebook_purchase_" + data.paymentId });
    localStorage.setItem(firedKey, "1");
  }

  // Clear the one-time payload so a manual back/forward navigation doesn't
  // let a stale success screen re-display old data indefinitely.
  sessionStorage.removeItem("tfr_ebook_success_payload");
});
</script>
</body>
</html>
